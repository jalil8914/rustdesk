# Full release build for the Aqsacloud client.
#
# Triggered by pushes to aqsacloud/main. Day-to-day work happens on
# aqsacloud/dev, which only runs the fast flutter-analyze gate; merge dev into
# main when you want binaries.
name: Aqsacloud release build

on:
  workflow_dispatch:
  push:
    branches:
      - aqsacloud/main

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: aqsacloud-${{ github.run_number }}
    secrets: inherit
